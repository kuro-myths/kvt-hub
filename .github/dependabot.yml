version: 2
updates:
  # Composer (PHP)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Jakarta"
    labels:
      - "📦 dependencies"
      - "🐘 php"
    commit-message:
      prefix: "deps(composer):"
    open-pull-requests-limit: 5
    reviewers:
      - "kuro-myths"

  # NPM (Node.js)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Jakarta"
    labels:
      - "📦 dependencies"
      - "📦 npm"
    commit-message:
      prefix: "deps(npm):"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Jakarta"
    labels:
      - "📦 dependencies"
      - "⚙️ ci/cd"
    commit-message:
      prefix: "deps(actions):"
    open-pull-requests-limit: 3
