name: 🤖 Auto Commit Harian

# Jalan setiap hari jam 00:01 WIB (17:01 UTC)
on:
  schedule:
    - cron: '1 17 * * *'
  workflow_dispatch:  # Bisa trigger manual dari GitHub

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    name: Auto Commit & Push

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🕐 Set timezone WIB
        run: sudo timedatectl set-timezone Asia/Jakarta

      - name: 📊 Generate daily stats
        run: |
          TANGGAL=$(date '+%Y-%m-%d %H:%M:%S WIB')
          HARI=$(date '+%A')
          
          # Buat/update file statistik harian
          mkdir -p .github/stats
          
          cat > .github/stats/daily-log.md << EOF
          # 📊 Log Aktivitas Harian KVT Hub
          
          **Terakhir diperbarui:** ${TANGGAL}
          **Hari:** ${HARI}
          
          ## Statistik Repository
          
          | Metrik | Nilai |
          |--------|-------|
          | Total Files | $(find . -type f -not -path './.git/*' | wc -l) |
          | Total Lines | $(find . -type f -not -path './.git/*' -name '*.php' -o -name '*.blade.php' -o -name '*.js' -o -name '*.css' | head -100 | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}') |
          | PHP Files | $(find . -type f -name '*.php' -not -path './vendor/*' | wc -l) |
          | Blade Files | $(find . -type f -name '*.blade.php' | wc -l) |
          | Migration Files | $(find ./database/migrations -type f 2>/dev/null | wc -l) |
          | Model Files | $(find ./app/Models -type f 2>/dev/null | wc -l) |
          | Controller Files | $(find ./app/Http/Controllers -type f 2>/dev/null | wc -l) |
          | Route Files | $(find ./routes -type f -name '*.php' 2>/dev/null | wc -l) |
          
          ## Commit Terakhir
          
          $(git log --oneline -5)
          
          ---
          *Auto-generated by GitHub Actions pada ${TANGGAL}*
          EOF

      - name: 🔍 Cek perubahan
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Tidak ada perubahan."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Ada perubahan, siap commit."
          fi

      - name: 📝 Auto commit
        if: steps.check.outputs.changed == 'true'
        run: |
          TANGGAL=$(date '+%Y-%m-%d')
          WAKTU=$(date '+%H:%M WIB')
          
          git config user.name "kuro-myths[bot]"
          git config user.email "kuro-myths[bot]@users.noreply.github.com"
          git commit -m "chore: auto update harian — ${TANGGAL} ${WAKTU} 🐱"
          git push origin main

      - name: ✅ Selesai
        run: |
          if [ "${{ steps.check.outputs.changed }}" == "true" ]; then
            echo "✅ Auto commit berhasil pada $(date '+%Y-%m-%d %H:%M:%S WIB')"
          else
            echo "ℹ️ Tidak ada perubahan untuk di-commit."
          fi
