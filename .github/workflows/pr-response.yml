name: 🔀 Auto Respond Pull Requests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  welcome-and-review:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    name: Welcome & Auto Review PR

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Auto Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const labels = [];
            const changedFiles = files.data.map(f => f.filename);

            // Deteksi area berdasarkan file yang diubah
            if (changedFiles.some(f => f.match(/^app\/Http\/Controllers\//)))
              labels.push('🎯 controllers');
            if (changedFiles.some(f => f.match(/^app\/Models\//)))
              labels.push('🗄️ models');
            if (changedFiles.some(f => f.match(/^resources\/views\//)))
              labels.push('🎨 views');
            if (changedFiles.some(f => f.match(/^database\//)))
              labels.push('🗃️ migrations');
            if (changedFiles.some(f => f.match(/^routes\//)))
              labels.push('🛣️ routes');
            if (changedFiles.some(f => f.match(/\.(md|txt)$/)))
              labels.push('📝 docs');
            if (changedFiles.some(f => f.match(/^tests\//)))
              labels.push('🧪 tests');
            if (changedFiles.some(f => f.match(/^\.github\//)))
              labels.push('⚙️ ci/cd');
            if (changedFiles.some(f => f.match(/chatbot|chat/i)))
              labels.push('🤖 ai');
            if (changedFiles.some(f => f.match(/code.?executor/i)))
              labels.push('🖥️ code-executor');

            // Deteksi size
            const additions = context.payload.pull_request.additions || 0;
            const deletions = context.payload.pull_request.deletions || 0;
            const totalChanges = additions + deletions;

            if (totalChanges < 10) labels.push('📦 size/xs');
            else if (totalChanges < 50) labels.push('📦 size/s');
            else if (totalChanges < 200) labels.push('📦 size/m');
            else if (totalChanges < 500) labels.push('📦 size/l');
            else labels.push('📦 size/xl');

            // Buat label jika belum ada
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'ededed'
                });
              }
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }

      - name: 📊 Generate PR Stats
        id: stats
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          FILES_CHANGED=$(git diff --name-only $BASE...$HEAD 2>/dev/null | wc -l || echo "?")
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}

          echo "files=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT

      - name: 💬 Welcome & Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const changedFiles = pr.changed_files || 0;

            let sizeEmoji = '📦';
            let sizeText = 'Kecil';
            const total = additions + deletions;
            if (total > 500) { sizeEmoji = '🔴'; sizeText = 'Sangat Besar'; }
            else if (total > 200) { sizeEmoji = '🟠'; sizeText = 'Besar'; }
            else if (total > 50) { sizeEmoji = '🟡'; sizeText = 'Sedang'; }
            else { sizeEmoji = '🟢'; sizeText = 'Kecil'; }

            let response = `## 🔀 Pull Request Review — KVT Hub\n\n`;
            response += `Halo @${author}! Terima kasih atas kontribusinya! 🎉\n\n`;

            response += `### 📊 Statistik PR\n\n`;
            response += `| Metrik | Nilai |\n`;
            response += `|--------|-------|\n`;
            response += `| 📁 File Changed | ${changedFiles} |\n`;
            response += `| ➕ Additions | +${additions} |\n`;
            response += `| ➖ Deletions | -${deletions} |\n`;
            response += `| ${sizeEmoji} Size | **${sizeText}** |\n\n`;

            // Checklist otomatis
            response += `### ✅ Review Checklist\n\n`;
            response += `- [ ] Kode mengikuti konvensi proyek\n`;
            response += `- [ ] Tidak ada conflict dengan \`main\`\n`;
            response += `- [ ] Dokumentasi diperbarui (jika diperlukan)\n`;
            response += `- [ ] Test ditambahkan/diperbarui (jika diperlukan)\n`;
            response += `- [ ] Commit message mengikuti [Conventional Commits](CONTRIBUTING.md)\n\n`;

            if (total > 500) {
              response += `> ⚠️ **PR ini cukup besar (${total} baris).** Pertimbangkan untuk memecah menjadi PR yang lebih kecil agar review lebih mudah.\n\n`;
            }

            response += `---\n`;
            response += `> 🐱 *Kuro-bot sedang mereview PR ini. Maintainer akan segera memberikan feedback.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: response
            });

  update-notification:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    name: Notify PR Updated
    steps:
      - name: 💬 Update Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `🔄 PR diperbarui oleh @${pr.user.login}. Commit baru terdeteksi — review ulang diperlukan.\n\n**Commit terbaru:** \`${context.payload.after.substring(0, 7)}\``
            });
