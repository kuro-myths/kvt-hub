name: 🤖 K-Arma — PR Response

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

env:
  BOT_AVATAR: "https://raw.githubusercontent.com/kuro-myths/kvt-hub/main/.github/bot-avatar.png"

jobs:
  welcome-and-review:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    name: 🤖 K-Arma PR Review

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Auto Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const labels = [];
            const changed = files.data.map(f => f.filename);

            const areaPatterns = {
              '🎯 controllers': /^app\/Http\/Controllers\//,
              '🗄️ models': /^app\/Models\//,
              '🎨 views': /^resources\/views\//,
              '🗃️ migrations': /^database\//,
              '🛣️ routes': /^routes\//,
              '📝 docs': /\.(md|txt)$/,
              '🧪 tests': /^tests\//,
              '⚙️ ci/cd': /^\.github\//,
              '🤖 ai': /chatbot|chat|openai/i,
              '🖥️ code-executor': /code.?executor/i,
              '🔒 security': /auth|middleware|guard/i
            };

            for (const [label, regex] of Object.entries(areaPatterns)) {
              if (changed.some(f => regex.test(f))) labels.push(label);
            }

            const total = (context.payload.pull_request.additions || 0) + (context.payload.pull_request.deletions || 0);
            if (total < 10) labels.push('📦 size/xs');
            else if (total < 50) labels.push('📦 size/s');
            else if (total < 200) labels.push('📦 size/m');
            else if (total < 500) labels.push('📦 size/l');
            else labels.push('📦 size/xl');

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: 'ededed'
                });
              }
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, labels
              });
            }

      - name: 🤖 K-Arma Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const avatar = process.env.BOT_AVATAR;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const changedFiles = pr.changed_files || 0;
            const total = additions + deletions;

            let sizeEmoji, sizeText, sizeAdvice = '';
            if (total > 500) {
              sizeEmoji = '🔴'; sizeText = 'Sangat Besar';
              sizeAdvice = `\n> ⚠️ **PR ini cukup besar (${total} baris).** Pertimbangkan memecah menjadi PR lebih kecil.`;
            } else if (total > 200) { sizeEmoji = '🟠'; sizeText = 'Besar'; }
            else if (total > 50) { sizeEmoji = '🟡'; sizeText = 'Sedang'; }
            else { sizeEmoji = '🟢'; sizeText = 'Kecil'; }

            // Analisis file yang diubah
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number
            });
            const changed = files.data.map(f => f.filename);

            let areas = [];
            if (changed.some(f => f.includes('Controllers/'))) areas.push('🎯 Controllers');
            if (changed.some(f => f.includes('Models/'))) areas.push('🗄️ Models');
            if (changed.some(f => f.includes('views/'))) areas.push('🎨 Views');
            if (changed.some(f => f.includes('migrations'))) areas.push('🗃️ Database');
            if (changed.some(f => f.includes('routes/'))) areas.push('🛣️ Routes');
            if (changed.some(f => f.match(/\.md$/))) areas.push('📝 Docs');
            if (changed.some(f => f.includes('.github/'))) areas.push('⚙️ CI/CD');

            let r = `<div align="center">\n<img src="${avatar}" width="60"><br>\n<strong>🤖 K-Arma — PR Review</strong>\n</div>\n\n---\n\n`;
            r += `Halo @${author}! Terima kasih atas kontribusinya! 🎉\n\n`;

            r += `## 📊 Analisis Pull Request\n\n`;
            r += `| Metrik | Nilai |\n|--------|-------|\n`;
            r += `| 📁 Files Changed | **${changedFiles}** |\n`;
            r += `| ➕ Additions | **+${additions}** |\n`;
            r += `| ➖ Deletions | **-${deletions}** |\n`;
            r += `| ${sizeEmoji} Size | **${sizeText}** |\n`;
            if (areas.length > 0)
              r += `| 🎯 Area | ${areas.join(', ')} |\n`;
            r += `\n`;
            r += sizeAdvice + '\n\n';

            // File detail
            r += `<details>\n<summary>📁 Files Changed (${changedFiles})</summary>\n\n`;
            for (const f of files.data.slice(0, 30)) {
              const icon = f.status === 'added' ? '🟢' : f.status === 'removed' ? '🔴' : '🟡';
              r += `- ${icon} \`${f.filename}\` (+${f.additions} / -${f.deletions})\n`;
            }
            if (files.data.length > 30) r += `- ... dan ${files.data.length - 30} file lainnya\n`;
            r += `\n</details>\n\n`;

            // Review checklist
            r += `## ✅ Review Checklist\n\n`;
            r += `- [ ] Kode mengikuti konvensi proyek (PSR-12, Blade, Tailwind)\n`;
            r += `- [ ] Tidak ada conflict dengan \`main\`\n`;
            r += `- [ ] Migration & seeder diperbarui (jika ada perubahan DB)\n`;
            r += `- [ ] Dokumentasi diperbarui (jika diperlukan)\n`;
            r += `- [ ] Commit message mengikuti [Conventional Commits](CONTRIBUTING.md)\n`;
            r += `- [ ] Tested locally (\`php artisan test\`)\n\n`;

            // Tips berdasarkan area
            if (changed.some(f => f.includes('migrations'))) {
              r += `> 🗄️ **Database changes detected!** Pastikan migration bisa di-rollback: \`php artisan migrate:rollback\`\n\n`;
            }
            if (changed.some(f => f.includes('routes/'))) {
              r += `> 🛣️ **Route changes detected!** Jalankan: \`php artisan route:list\` untuk verifikasi\n\n`;
            }
            if (changed.some(f => f.match(/auth|middleware/i))) {
              r += `> 🔒 **Auth/Security changes detected!** Test semua 7 peran: Admin, Staff, Guru, Siswa, Mahasiswa, Orang Tua, Pengunjung\n\n`;
            }

            r += `---\n\n`;
            r += `<div align="center">\n<img src="${avatar}" width="20"> <strong>K-Arma</strong> — KVT Hub AI Assistant<br>\n`;
            r += `<sub>⏱️ Maintainer akan review secepatnya</sub>\n</div>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, body: r
            });

  update-notification:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    name: 🔄 PR Updated
    steps:
      - name: 💬 Notify Update
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const avatar = process.env.BOT_AVATAR;
            const sha = context.payload.after.substring(0, 7);

            let r = `<div>\n<img src="${avatar}" width="32" align="left" style="margin-right: 12px;">\n\n**🤖 K-Arma**\n</div>\n\n`;
            r += `🔄 PR diperbarui oleh @${pr.user.login}\n\n`;
            r += `**Commit terbaru:** \`${sha}\` — Re-review diperlukan.\n\n`;
            r += `---\n<sub><img src="${avatar}" width="14"> K-Arma · KVT Hub AI Assistant</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, body: r
            });
