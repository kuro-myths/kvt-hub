name: 📊 Weekly Project Stats

on:
  schedule:
    - cron: '0 17 * * 1'  # Setiap Senin jam 00:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  weekly-stats:
    runs-on: ubuntu-latest
    name: 📊 Generate Weekly Stats

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Gather Stats
        uses: actions/github-script@v7
        id: stats
        with:
          script: |
            // Repository info
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Open issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            // Open PRs
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            // Recent commits (last 7 days)
            const since = new Date();
            since.setDate(since.getDate() - 7);
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: since.toISOString(),
              per_page: 100
            });

            // Contributors
            const contributors = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const stats = {
              stars: repo.data.stargazers_count,
              forks: repo.data.forks_count,
              watchers: repo.data.watchers_count,
              openIssues: issues.data.filter(i => !i.pull_request).length,
              openPRs: prs.data.length,
              weeklyCommits: commits.data.length,
              contributors: contributors.data.length,
              size: repo.data.size,
              language: repo.data.language
            };

            core.setOutput('stats', JSON.stringify(stats));

      - name: 📝 Update Stats File
        run: |
          STATS='${{ steps.stats.outputs.stats }}'
          TANGGAL=$(date '+%Y-%m-%d %H:%M WIB')

          mkdir -p .github/stats

          cat > .github/stats/weekly-report.md << EOF
          # 📊 KVT Hub — Weekly Stats Report

          > Last updated: ${TANGGAL}

          ## Repository

          | Metric | Value |
          |--------|-------|
          | ⭐ Stars | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['stars'])") |
          | 🍴 Forks | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['forks'])") |
          | 👁️ Watchers | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['watchers'])") |
          | 👥 Contributors | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['contributors'])") |

          ## Activity (Last 7 Days)

          | Metric | Value |
          |--------|-------|
          | 📝 Commits | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['weeklyCommits'])") |
          | 🐛 Open Issues | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['openIssues'])") |
          | 🔀 Open PRs | $(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['openPRs'])") |

          ---
          🐱 *Generated by kuro-myths[bot]*
          EOF

      - name: 📤 Commit Stats
        run: |
          git config user.name "kuro-myths[bot]"
          git config user.email "kuro-myths[bot]@users.noreply.github.com"
          git add .github/stats/
          if git diff --cached --quiet; then
            echo "✅ No changes"
          else
            git commit -m "stats: weekly report — $(date '+%Y-%m-%d') 📊"
            git push
          fi
