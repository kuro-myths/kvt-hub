name: 🗑️ Stale Issues & PRs

on:
  schedule:
    - cron: '0 18 * * 0'  # Setiap Minggu jam 01:00 WIB
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    name: 🗑️ Close Stale Issues & PRs

    steps:
      - name: 🗑️ Mark & Close Stale
        uses: actions/stale@v10
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: '⏰ stale'
          stale-pr-label: '⏰ stale'
          stale-issue-message: |
            ⏰ Issue ini sudah tidak aktif selama 30 hari.
            Issue akan ditutup otomatis dalam 7 hari jika tidak ada aktivitas baru.

            Jika masih relevan, silakan reply atau update issue ini. 🐱
          stale-pr-message: |
            ⏰ Pull Request ini sudah tidak aktif selama 30 hari.
            PR akan ditutup otomatis dalam 7 hari jika tidak ada aktivitas baru.

            Jika masih ingin di-merge, silakan update dan resolve conflicts. 🐱
          close-issue-message: |
            🔒 Issue ditutup otomatis karena tidak ada aktivitas selama 37 hari.
            Silakan buka issue baru jika masih diperlukan.
          close-pr-message: |
            🔒 PR ditutup otomatis karena tidak ada aktivitas selama 37 hari.
            Silakan buka PR baru jika masih ingin berkontribusi.
          exempt-issue-labels: '📌 pinned,🔒 security,🚀 priority'
          exempt-pr-labels: '📌 pinned,🚀 priority'
