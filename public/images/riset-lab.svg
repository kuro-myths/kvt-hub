    <rect x="45" y="80" width="50" height="30" rx="5" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="70" cy="95" r="8" fill="none" stroke="#22C55E" stroke-width="1"/>
    <rect x="60" y="50" width="20" height="35" rx="3" fill="#334155"/>
    <circle cx="70" cy="45" r="10" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="70" cy="45" r="4" fill="#22C55E" opacity="0.3"/>
  </g>
  <!-- Data Charts -->
  <g transform="translate(280, 100)">
