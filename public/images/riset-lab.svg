    <rect x="15" y="90" width="140" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="100" width="130" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="110" width="140" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="120" width="100" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="140" width="140" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="150" width="120" height="4" rx="2" fill="#475569"/>
    <rect x="15" y="160" width="140" height="4" rx="2" fill="#475569"/>
