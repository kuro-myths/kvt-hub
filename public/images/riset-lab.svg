    <rect x="175" y="55" width="20" height="70" rx="2" fill="#A855F7" opacity="0.8"/>
    <!-- Axis -->
    <line x1="20" y1="125" x2="205" y2="125" stroke="#334155" stroke-width="1"/>
    <line x1="20" y1="40" x2="20" y2="125" stroke="#334155" stroke-width="1"/>
  </g>
  <!-- Publication -->
  <g transform="translate(550, 80)">
