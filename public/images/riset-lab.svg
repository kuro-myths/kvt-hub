  <!-- DNA Helix -->
  <g transform="translate(230, 280)">
    <path d="M0 0 Q30 20 60 0 Q90 -20 120 0 Q150 20 180 0" stroke="#A855F7" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M0 30 Q30 10 60 30 Q90 50 120 30 Q150 10 180 30" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.5"/>
    <line x1="30" y1="10" x2="30" y2="20" stroke="#334155" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="30" stroke="#334155" stroke-width="1"/>
    <line x1="90" y1="10" x2="90" y2="20" stroke="#334155" stroke-width="1"/>
