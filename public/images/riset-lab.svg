    <rect x="55" y="80" width="20" height="45" rx="2" fill="#3399FF" opacity="0.8"/>
    <rect x="85" y="60" width="20" height="65" rx="2" fill="#3399FF" opacity="0.9"/>
    <rect x="115" y="45" width="20" height="80" rx="2" fill="#22C55E"/>
