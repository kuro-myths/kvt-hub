<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="16" fill="#0A0F1C"/>
  <circle cx="300" cy="200" r="160" fill="url(#rg)" opacity="0.06"/>
  <!-- Certificate Frame -->
  <rect x="100" y="60" width="400" height="280" rx="12" fill="#111827" stroke="url(#gold)" stroke-width="2"/>
  <rect x="110" y="70" width="380" height="260" rx="8" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.3" stroke-dasharray="6,4"/>
  <!-- Badge -->
  <circle cx="300" cy="120" r="30" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="24">🏆</text>
  <!-- Title -->
  <text x="300" y="175" text-anchor="middle" fill="#F59E0B" font-family="serif" font-size="18" font-weight="bold">SERTIFIKAT</text>
  <text x="300" y="195" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">DIBERIKAN KEPADA</text>
  <!-- Name -->
  <line x1="180" y1="225" x2="420" y2="225" stroke="#334155" stroke-width="1"/>
  <text x="300" y="220" text-anchor="middle" fill="white" font-family="serif" font-size="16" font-weight="bold">Nama Peserta</text>
  <!-- Description -->
  <text x="300" y="250" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="9">Telah menyelesaikan seluruh materi dan evaluasi</text>
  <text x="300" y="265" text-anchor="middle" fill="#3399FF" font-family="system-ui" font-size="11" font-weight="bold">Kompetensi Cloud Technology</text>
  <text x="300" y="280" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="9">dengan nilai Sangat Baik (A)</text>
  <!-- Signature area -->
  <line x1="160" y1="315" x2="270" y2="315" stroke="#334155" stroke-width="0.5"/>
  <text x="215" y="328" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="8">Direktur KVT Hub</text>
  <line x1="330" y1="315" x2="440" y2="315" stroke="#334155" stroke-width="0.5"/>
  <text x="385" y="328" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="8">Ketua Program</text>
  <!-- Corner decorations -->
  <path d="M105 75 L105 95 M105 75 L125 75" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <path d="M495 75 L495 95 M495 75 L475 75" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <path d="M105 325 L105 305 M105 325 L125 325" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <path d="M495 325 L495 305 M495 325 L475 325" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <!-- Stars -->
  <circle cx="150" cy="40" r="2" fill="#F59E0B" opacity="0.4"/>
  <circle cx="450" cy="370" r="2" fill="#F59E0B" opacity="0.4"/>
  <circle cx="530" cy="80" r="1.5" fill="#3399FF" opacity="0.3"/>
  <circle cx="70" cy="350" r="1.5" fill="#A855F7" opacity="0.3"/>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="50%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <radialGradient id="rg"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
</svg>
