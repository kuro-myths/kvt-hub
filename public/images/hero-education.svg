<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#0A0F1C"/>
  <!-- Glow -->
  <circle cx="400" cy="300" r="200" fill="url(#g1)" opacity="0.15"/>
  <circle cx="250" cy="200" r="120" fill="url(#g2)" opacity="0.1"/>
  <!-- Graduation Cap -->
  <g transform="translate(300, 150)">
    <polygon points="100,0 200,50 100,100 0,50" fill="url(#cap)" stroke="#3399FF" stroke-width="2"/>
    <rect x="90" y="50" width="20" height="80" fill="#3399FF" opacity="0.8"/>
    <circle cx="100" cy="130" r="8" fill="#3399FF"/>
    <line x1="200" y1="50" x2="220" y2="100" stroke="#FFD700" stroke-width="3"/>
    <circle cx="220" cy="105" r="6" fill="#FFD700"/>
    <rect x="215" y="111" width="10" height="20" fill="#FFD700" opacity="0.6"/>
  </g>
  <!-- Books -->
  <g transform="translate(120, 320)">
    <rect x="0" y="0" width="120" height="20" rx="3" fill="#22C55E" opacity="0.8"/>
    <rect x="5" y="-25" width="110" height="20" rx="3" fill="#3B82F6" opacity="0.8"/>
    <rect x="10" y="-50" width="100" height="20" rx="3" fill="#A855F7" opacity="0.8"/>
    <rect x="8" y="-75" width="105" height="20" rx="3" fill="#F59E0B" opacity="0.8"/>
  </g>
  <!-- Laptop -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="200" height="130" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="180" height="100" rx="4" fill="#0F172A"/>
    <text x="50" y="55" fill="#3399FF" font-family="monospace" font-size="11">&lt;/code&gt;</text>
    <text x="40" y="75" fill="#22C55E" font-family="monospace" font-size="10">Learn.build()</text>
    <text x="50" y="95" fill="#A855F7" font-family="monospace" font-size="10">grow.🚀</text>
    <path d="M-20 130 L220 130 L200 145 L0 145 Z" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  </g>
  <!-- Atoms / Science -->
  <g transform="translate(150, 180)">
    <ellipse cx="0" cy="0" rx="40" ry="15" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="15" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="40" ry="15" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="5" fill="#06B6D4"/>
  </g>
  <!-- Connection Lines -->
  <line x1="190" y1="180" x2="300" y2="200" stroke="#3399FF" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="450" y1="300" x2="370" y2="250" stroke="#A855F7" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="240" y1="340" x2="330" y2="280" stroke="#22C55E" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Stars -->
  <circle cx="100" cy="80" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="700" cy="100" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="650" cy="450" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="150" cy="500" r="1.5" fill="#3399FF" opacity="0.4"/>
  <circle cx="680" cy="200" r="1.5" fill="#A855F7" opacity="0.4"/>
  <!-- Text -->
  <text x="400" y="500" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="bold" opacity="0.9">KVT Hub</text>
  <text x="400" y="530" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14">Global Education &amp; Research Ecosystem</text>
  <!-- Gradients -->
  <defs>
    <radialGradient id="g1"><stop offset="0%" stop-color="#3399FF"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <radialGradient id="g2"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3399FF"/><stop offset="100%" stop-color="#1E40AF"/></linearGradient>
  </defs>
</svg>
