<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="16" fill="#0A0F1C"/>
  <circle cx="300" cy="200" r="150" fill="url(#rg)" opacity="0.06"/>
  <!-- Community/Network -->
  <!-- Central person -->
  <circle cx="300" cy="180" r="30" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <text x="300" y="187" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="22">👤</text>
  <!-- Person 1 - top left -->
  <circle cx="160" cy="100" r="22" fill="#1E293B" stroke="#3399FF" stroke-width="1.5"/>
  <text x="160" y="106" text-anchor="middle" fill="#3399FF" font-family="system-ui" font-size="16">👩</text>
  <line x1="180" y1="115" x2="275" y2="165" stroke="#3399FF" stroke-width="1" opacity="0.3"/>
  <!-- Person 2 - top right -->
  <circle cx="440" cy="100" r="22" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="440" y="106" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="16">👨</text>
  <line x1="420" y1="115" x2="325" y2="165" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
  <!-- Person 3 - left -->
  <circle cx="120" cy="230" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="120" y="236" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="16">👩‍🎓</text>
  <line x1="142" y1="225" x2="270" y2="190" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>
  <!-- Person 4 - right -->
  <circle cx="480" cy="230" r="22" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
  <text x="480" y="236" text-anchor="middle" fill="#EC4899" font-family="system-ui" font-size="16">👨‍🏫</text>
  <line x1="458" y1="225" x2="330" y2="190" stroke="#EC4899" stroke-width="1" opacity="0.3"/>
  <!-- Person 5 - bottom left -->
  <circle cx="200" cy="320" r="22" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" fill="#06B6D4" font-family="system-ui" font-size="16">🧑</text>
  <line x1="215" y1="300" x2="290" y2="210" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
  <!-- Person 6 - bottom right -->
  <circle cx="400" cy="320" r="22" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" fill="#EF4444" font-family="system-ui" font-size="16">👩‍💻</text>
  <line x1="385" y1="300" x2="310" y2="210" stroke="#EF4444" stroke-width="1" opacity="0.3"/>
  <!-- Cross connections -->
  <line x1="160" y1="122" x2="120" y2="208" stroke="#334155" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="440" y1="122" x2="480" y2="208" stroke="#334155" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="200" y1="298" x2="400" y2="298" stroke="#334155" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
  <!-- Labels -->
  <text x="300" y="370" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="bold">Komunitas Pembelajaran</text>
  <text x="300" y="390" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="10">Terhubung • Kolaboratif • Inspiratif</text>
  <!-- Floating elements -->
  <circle cx="80" cy="50" r="2" fill="#A855F7" opacity="0.3"/>
  <circle cx="520" cy="60" r="2" fill="#22C55E" opacity="0.3"/>
  <circle cx="550" cy="370" r="1.5" fill="#3399FF" opacity="0.3"/>
  <circle cx="50" cy="360" r="1.5" fill="#F59E0B" opacity="0.3"/>
  <defs>
    <radialGradient id="rg"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
</svg>
