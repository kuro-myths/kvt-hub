<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="16" fill="#0A0F1C"/>
  <circle cx="400" cy="200" r="180" fill="url(#rg)" opacity="0.06"/>
  <!-- Jenjang Steps (Educational Levels) -->
  <!-- Step 1 - TK/PAUD -->
  <g transform="translate(50, 300)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="45" y="35" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="22">🧒</text>
    <text x="45" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">TK/PAUD</text>
    <text x="45" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Usia 4-6</text>
  </g>
  <!-- Arrow -->
  <line x1="145" y1="320" x2="165" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 2 - SD -->
  <g transform="translate(165, 260)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
    <text x="45" y="35" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="22">📖</text>
    <text x="45" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">SD/MI</text>
    <text x="45" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Kelas 1-6</text>
  </g>
  <line x1="260" y1="280" x2="280" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 3 - SMP -->
  <g transform="translate(280, 220)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#3399FF" stroke-width="1.5"/>
    <text x="45" y="35" text-anchor="middle" fill="#3399FF" font-family="system-ui" font-size="22">📝</text>
    <text x="45" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">SMP/MTs</text>
    <text x="45" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Kelas 7-9</text>
  </g>
  <line x1="375" y1="240" x2="395" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 4 - SMA/SMK -->
  <g transform="translate(395, 180)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="45" y="35" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="22">🎓</text>
    <text x="45" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">SMA/SMK</text>
    <text x="45" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Kelas 10-12</text>
  </g>
  <line x1="490" y1="200" x2="510" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 5 - Diploma/S1 -->
  <g transform="translate(510, 140)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="45" y="35" text-anchor="middle" fill="#EC4899" font-family="system-ui" font-size="22">🏛️</text>
    <text x="45" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">D3/S1</text>
    <text x="45" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Pendidikan Tinggi</text>
  </g>
  <line x1="605" y1="160" x2="625" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 6 - S2/S3 -->
  <g transform="translate(625, 80)">
    <rect width="110" height="90" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <text x="55" y="35" text-anchor="middle" fill="#EF4444" font-family="system-ui" font-size="22">🎯</text>
    <text x="55" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="9" font-weight="bold">S2/S3/Profesi</text>
    <text x="55" y="70" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">Pascasarjana</text>
    <text x="55" y="82" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="7">&amp; Spesialisasi</text>
  </g>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-family="system-ui" font-size="16" font-weight="bold">Jenjang Pendidikan Indonesia</text>
  <text x="400" y="55" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="10">Dari PAUD hingga Pascasarjana — Semua Ada di KVT Hub</text>
  <!-- Decorative -->
  <circle cx="50" cy="50" r="2" fill="#F59E0B" opacity="0.4"/>
  <circle cx="750" cy="380" r="2" fill="#EF4444" opacity="0.4"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#334155"/></marker>
    <radialGradient id="rg"><stop offset="0%" stop-color="#3399FF"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
</svg>
