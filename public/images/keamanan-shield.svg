<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="16" fill="#0A0F1C"/>
  <!-- Glow -->
  <circle cx="400" cy="200" r="180" fill="url(#rg)" opacity="0.06"/>
  <!-- Shield -->
  <g transform="translate(340, 50)">
    <path d="M60 0 L120 30 L120 100 C120 160 60 190 60 190 C60 190 0 160 0 100 L0 30 Z" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
    <path d="M60 15 L110 40 L110 100 C110 150 60 175 60 175 C60 175 10 150 10 100 L10 40 Z" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.3"/>
    <text x="60" y="95" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="36">🔒</text>
    <text x="60" y="130" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="10" font-weight="bold">SECURE</text>
  </g>
  <!-- Security Elements -->
  <!-- Encryption -->
  <g transform="translate(80, 100)">
    <rect width="140" height="70" rx="8" fill="#1E293B" stroke="#3399FF" stroke-width="1" opacity="0.8"/>
    <text x="70" y="28" text-anchor="middle" fill="#3399FF" font-family="system-ui" font-size="11" font-weight="bold">🔐 Enkripsi</text>
    <text x="70" y="48" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">AES-256-GCM</text>
    <text x="70" y="62" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">End-to-End</text>
    <line x1="140" y1="135" x2="340" y2="150" stroke="#3399FF" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  </g>
  <!-- 2FA -->
  <g transform="translate(580, 80)">
    <rect width="140" height="70" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" opacity="0.8"/>
    <text x="70" y="28" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="11" font-weight="bold">🔑 2FA</text>
    <text x="70" y="48" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">Multi-Factor</text>
    <text x="70" y="62" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">Authentication</text>
    <line x1="0" y1="115" x2="-120" y2="140" stroke="#A855F7" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  </g>
  <!-- Firewall -->
  <g transform="translate(80, 260)">
    <rect width="140" height="70" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" opacity="0.8"/>
    <text x="70" y="28" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="bold">🛡️ Firewall</text>
    <text x="70" y="48" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">WAF Protection</text>
    <text x="70" y="62" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">DDoS Shield</text>
    <line x1="140" y1="-20" x2="340" y2="0" stroke="#F59E0B" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  </g>
  <!-- Backup -->
  <g transform="translate(580, 260)">
    <rect width="140" height="70" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
    <text x="70" y="28" text-anchor="middle" fill="#06B6D4" font-family="system-ui" font-size="11" font-weight="bold">☁️ Backup</text>
    <text x="70" y="48" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">Auto Backup</text>
    <text x="70" y="62" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">99.9% Uptime</text>
    <line x1="0" y1="-20" x2="-120" y2="0" stroke="#06B6D4" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="2" fill="#22C55E" opacity="0.3"/>
  <circle cx="750" cy="50" r="2" fill="#22C55E" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#22C55E" opacity="0.3"/>
  <circle cx="750" cy="380" r="2" fill="#22C55E" opacity="0.3"/>
  <defs>
    <radialGradient id="rg"><stop offset="0%" stop-color="#22C55E"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
</svg>
